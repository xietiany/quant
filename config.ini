[APIKEY]
API = your_api_key_here

[ECON]
; Corporate income tax rate (%)
tax_rate = 25
; Risk-free rate — 10-year Chinese government bond yield (%)
risk_free_rate = 1.64
; Floor for cost of equity when CAPM produces a negative result (%)
lowest_market_return = 6.0
; Expected market return method: historical | implied_erp | fixed_erp
market_return_method = historical
; Number of years to average for the historical method
n_years = 10
; Fixed equity risk premium used when method = fixed_erp (Damodaran China estimate, %)
fixed_erp = 7.5

[VALUATION]
; Required-return approach: true = WACC, false = CAPM only
wacc_approach = true
; Cash flow to discount: fcfe | earning
valuation_method = fcfe
; Input used to estimate growth: earning | fcfe | div
growth_calc_method = earning
; Years of historical data used to estimate first-stage growth
growth_calc_horizon = 5
; Forecast horizon (years)
valuation_horizon = 5
; DCF stage model: single | two | three
valuation_stage = single
; Use default long-term GDP growth instead of calculating it
long_term_growth_default = true
